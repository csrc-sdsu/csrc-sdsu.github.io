<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOLE — Mimetic Operators Library Enhanced</title>
  <link rel="icon" type="image/png" href="https://mole-ose.org/Images/mole-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" 
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
<!--<title>MOLE — Mimetic Operators Library Enhanced</title>-->
<img src="../Images/TopBannerHome.png" 
    alt="Mimetic Operators Library Enhanced (MOLE) - Open-source Software Ecosystem"
    width="100%"/>

<!-- NAV -->
<nav>
  <a href="https://mole-docs.readthedocs.io/">
    <img src="https://mole-ose.org/Images/mole-logo.png" alt="MOLE Library Information" height="50"/>
  </a>
  <ul class="nav-links" id="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="../Gallery/gallery.html">Gallery</a></li>
    <li><a href="../Documentation/documentation.html">Documentation</a></li>
    <li><a href="#events">Events</a></li>
    <li><a href="../Collaborators/collaborators.html">Collaborators</a></li>
    <li><a href="../Sponsors/sponsors.html">Sponsors</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">&#9776;</button>
</nav>

<!-- UPCOMING EVENTS -->
<section id="events">
  <div class="section-header">
    <p style="font-family: var(--sans); color:#265059; font-size: 32px; font-weight: 600; margin-bottom: 1px; ">
      Current MOLE Library Version Release: </p>
  </div>
  <div class="events-grid" id="events-grid"></div>
  <!-- filter-row: reserved for future event-type filtering
  <div class="filter-row" id="filter-row"></div>
  -->
</section>

<!-- PAST EVENTS -->
<section id="past-events">
  <div class="section-header">
    <p style="font-family: var(--sans); color:#265059; font-size: 32px; font-weight: 600; margin-bottom: 1px; ">
      MOLE Library Releases:</p>
  </div>
  <div class="events-grid" id="pevents-grid"></div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-left">© 2008-2024 San Diego State University Research Foundation (SDSURF)</div>
  <div class="footer-links">
    <a href="https://www.csrc.sdsu.edu/" target="_blank">CSRC at SDSU</a>
    <a href="https://castillo.sdsu.edu/" target="_blank">Contact</a>
  </div>
</footer>

<script>
  /* ── DATA ── Edit this section to update content ── */

  const CVERSION = [
    { year: "2026", month: "Sep", day: "26",  version: "MOLE v1.3.0", 
      high: "C++ and Octave Enhancements + New Python and Julia Implementations.", 
      doc: "Full version release notes", url: "../PDFs/MOLE_ReleaseNotes_v1_3_0.pdf"},
  ];

    const PVERSIONS = [ 
    { year: "2026", month: "May", day: "8",  version: "MOLE Library v1.2",
      doc: "details", url: "../PDFs/MOLE_ReleaseNotes_v1_2.pdf"},
    { year: "2025", month: "August", day: "13",  version: "MOLE Library v1.1",
      doc: "details", url: "https://github.com/csrc-sdsu/mole/releases#release-v1.1.0"},
    { year: "2024", month: "August", day: "4",  version: "MOLE Library v1.1",
      doc: "details", url: "https://github.com/csrc-sdsu/mole/releases#release-v1.0"},
  ];


/* ── RENDER: Current MOLE Version Release ── */
  function renderCVersion() {
    document.getElementById('events-grid').innerHTML = CVERSION.map(ev => `
      <div class="events-card">
          <span class="month">${ev.month}</span>
          <span class="day">${ev.day}</span>
          <span class="month">${ev.year}</span>
        <div class="events-info">
          <div class="events-title">${ev.version}</div>
          <div class="events-meta">${ev.high}</div>
          <div class="events-meta">
            <ul>
              <li>See <a href="${ev.url}" target="_blank">${ev.doc}</a> for more details.</li>
              <li>View the PDF version of <a href="../PDFs/MOLE_v1_3_0_Release_flyer.pdf" target="_blank">the v1.3.0 release announcement</a>.</li>
              <li>Access <a href="https://github.com/csrc-sdsu/mole" target="_blank">the MOLE Library GitHub repository.</a>
            </ul>
        </div>
      </div>
    `).join('');
  }

/* ── RENDER: PAST EVENTS ── */
  function renderPVersions() {
    document.getElementById('pevents-grid').innerHTML = PVERSIONS.map(ev => `
      <div class="events-card">
          <span class="month">${ev.month}</span>
          <span class="day">${ev.day}</span>
          <span class="day">${ev.year}</span>
        <div class="events-info">
          <div class="events-title">${ev.version}: <a href="${ev.url}" target="_blank">${ev.doc}</a>.</div>
        </div>
      </div>
    `).join('');
  }
  /* ── INIT ── */
  renderCVersion();
  renderPVersions();

  /* ── HAMBURGER MENU ── */
  const hamburger = document.getElementById('nav-hamburger');
  const navLinks = document.getElementById('nav-links');
  hamburger.addEventListener('click', function () {
    const isOpen = navLinks.classList.toggle('nav-open');
    hamburger.setAttribute('aria-expanded', isOpen);
    hamburger.textContent = isOpen ? '✕' : '☰';
  });
  navLinks.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () {
      navLinks.classList.remove('nav-open');
      hamburger.setAttribute('aria-expanded', 'false');
      hamburger.textContent = '☰';
    });
  });
</script>
</body>
</html>
